services:
  redis:
    image: redis:7-alpine
    container_name: backend_trial_redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    container_name: backend_trial_azurite
    restart: unless-stopped
    ports:
      - "127.0.0.1:10000:10000"
      - "127.0.0.1:10001:10001"
      - "127.0.0.1:10002:10002"
    command: ["azurite", "-l", "/data", "--blobHost", "0.0.0.0", "--queueHost", "0.0.0.0", "--tableHost", "0.0.0.0", "--skipApiVersionCheck"]
    volumes:
      - azurite_data:/data
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "10000"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: backend_trial_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - NODE_ENV=development
      - PORT=8000
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - STORAGE_PROVIDER=azurite
      - AZURITE_HOST=azurite
      - AZURITE_PORT=10000
      - AZURE_STORAGE_ACCOUNT_NAME=devstoreaccount1
      - AZURE_STORAGE_CONTAINER_NAME=videos
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
      azurite:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: backend_trial_worker
    restart: unless-stopped
    command: ["node", "src/workers/video.worker.js"]
    environment:
      - NODE_ENV=development
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - STORAGE_PROVIDER=azurite
      - AZURITE_HOST=azurite
      - AZURITE_PORT=10000
      - AZURE_STORAGE_ACCOUNT_NAME=devstoreaccount1
      - AZURE_STORAGE_CONTAINER_NAME=videos
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
      azurite:
        condition: service_healthy

volumes:
  redis_data:
  azurite_data:
